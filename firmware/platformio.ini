; Silver Back sensor firmware.
; USB serial only. BLE and Wi-Fi are tracked in ROADMAP.md.
;
;   pio run -e esp32dev
;   pio run -e esp32dev -t upload
;   pio device monitor -b 115200

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -D SILVERBACK_PIR_PIN=27
  -D SILVERBACK_LED_PIN=2
